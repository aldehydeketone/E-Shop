<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Titles -->
  <text x="300" y="50" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle">Phase 1: Login &amp; Token Generation</text>
  <text x="900" y="50" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle">Phase 2: JWT Validation &amp; Access</text>

  <!-- Paths -->
  <!-- 1. POST /api/auth/signin -->
  <path d="M 320 150 L 320 210" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="330" y="185" font-size="14" font-weight="500" fill="#3B82F6">1. POST /api/auth/signin</text>

  <!-- 2. Validate Credentials -->
  <path d="M 300 270 L 300 300 L 200 300 L 200 330" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="210" y="295" font-size="14" font-weight="500" fill="#64748B">2. Validate Credentials</text>

  <!-- 3. Fetch User -->
  <path d="M 200 390 L 200 450" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="210" y="425" font-size="14" font-weight="500" fill="#64748B">3. Fetch User (DB)</text>

  <!-- 4. Generate Token -->
  <path d="M 400 240 L 590 240 L 590 330" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="500" y="230" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle">4. Generate Token</text>

  <!-- 5. Return Cookie -->
  <path d="M 280 210 L 280 150" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="270" y="185" font-size="14" font-weight="500" fill="#10B981" text-anchor="end">5. Return HttpOnly Cookie</text>

  <!-- 6. Request + Cookie -->
  <path d="M 900 150 L 900 210" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="910" y="185" font-size="14" font-weight="500" fill="#3B82F6">6. Request + JWT Cookie</text>

  <!-- 7. Validate JWT -->
  <path d="M 800 240 L 610 240 L 610 330" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="700" y="230" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle">7. Validate JWT Signature</text>

  <!-- 8a. Valid -->
  <path d="M 900 270 L 900 300 L 800 300 L 800 330" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="810" y="295" font-size="14" font-weight="500" fill="#10B981">8a. Valid: Set Auth</text>

  <!-- 8b. Invalid -->
  <path d="M 900 270 L 900 300 L 1000 300 L 1000 330" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="990" y="295" font-size="14" font-weight="500" fill="#EF4444" text-anchor="end">8b. Invalid: 401 Unauth</text>

  <!-- Nodes -->
  <!-- Browser 1 -->
  <rect x="200" y="90" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="204" y1="94" x2="204" y2="146" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" />
  <text x="300" y="125" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">Client (Browser)</text>

  <!-- Browser 2 -->
  <rect x="800" y="90" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="804" y1="94" x2="804" y2="146" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" />
  <text x="900" y="125" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">Client (Browser)</text>

  <!-- AuthController -->
  <rect x="200" y="210" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="204" y1="214" x2="204" y2="266" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
  <text x="300" y="245" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">AuthController</text>

  <!-- AuthTokenFilter -->
  <rect x="800" y="210" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="804" y1="214" x2="804" y2="266" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
  <text x="900" y="245" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">AuthTokenFilter</text>

  <!-- UserDetailsServiceImpl -->
  <rect x="100" y="330" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="104" y1="334" x2="104" y2="386" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <text x="200" y="365" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">UserDetailsService</text>

  <!-- JwtUtils -->
  <rect x="500" y="330" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="504" y1="334" x2="504" y2="386" stroke="#EC4899" stroke-width="4" stroke-linecap="round" />
  <text x="600" y="365" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">JwtUtils</text>

  <!-- SecurityContext -->
  <rect x="700" y="330" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="704" y1="334" x2="704" y2="386" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <text x="800" y="365" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">SecurityContext</text>

  <!-- AuthEntryPointJwt -->
  <rect x="900" y="330" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="904" y1="334" x2="904" y2="386" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
  <text x="1000" y="365" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">AuthEntryPointJwt</text>

  <!-- UserRepository -->
  <rect x="100" y="450" width="200" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" rx="8" filter="url(#shadow)" />
  <line x1="104" y1="454" x2="104" y2="506" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <text x="200" y="485" font-size="15" font-weight="600" fill="#1E293B" text-anchor="middle">UserRepository (DB)</text>

</svg>
