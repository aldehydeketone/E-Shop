spring.application.name=sb-ecom

# ===========================
# PostgreSQL (Neon Database)
# ===========================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.data-source-properties.sslmode=require

# ===========================
# Project Configuration
# ===========================

project.image=${PROJECT_IMAGE_PATH:images}

# ===========================
# JWT Configuration
# ===========================

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:300000000}
spring.ecom.app.jwtCookieName=springBootEcom



# ===========================
# Frontend
# ===========================

frontend.url=${FRONTEND_URL:http://localhost:5173}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

# ===========================
# Stripe
# ===========================

stripe.secret.key=${STRIPE_SECRET_KEY}

# ===========================
# Logging (Optional)
# ===========================

# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# logging.level.org.springframework=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.springframework.security=DEBUG
# logging.level.com.ecommerce.project=DEBUG

# ===========================
# Server Port (Optional)
# Render automatically sets PORT
# ===========================

server.port=${PORT:8080}
